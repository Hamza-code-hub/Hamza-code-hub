<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="130" viewBox="0 0 1100 130" role="img" aria-labelledby="title desc">
  <title id="title">Explore selected repositories below</title>
  <desc id="desc">An animated footer guiding visitors toward Muhammad Hamza's pinned GitHub projects.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21D4FD" />
      <stop offset="0.52" stop-color="#2DD4BF" />
      <stop offset="1" stop-color="#FF6B4A" />
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1098" height="128" rx="8" fill="#0A0F17" stroke="#273544" stroke-width="2" />

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="550" y="42" fill="#F8FAFC" font-size="18" font-weight="700">SELECTED REPOSITORIES CONTINUE BELOW</text>
    <text x="550" y="66" fill="#8293A7" font-size="13">Research code, production systems, and applied AI projects</text>
  </g>

  <path d="M90 91 H448 M652 91 H1010" fill="none" stroke="#263747" stroke-width="2" />
  <path d="M90 91 H448 M652 91 H1010" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" values="0;-96" dur="3.2s" repeatCount="indefinite" />
  </path>

  <g transform="translate(550 88)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-28 -7 L0 13 L28 -7" stroke="#21D4FD" stroke-width="4" filter="url(#glow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 -4;0 4;0 -4" dur="1.8s" repeatCount="indefinite" />
    </path>
    <path d="M-18 13 L0 26 L18 13" stroke="#2DD4BF" stroke-width="3">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.8s" begin="-0.6s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 -3;0 5;0 -3" dur="1.8s" begin="-0.6s" repeatCount="indefinite" />
    </path>
  </g>

  <g fill="#FFFFFF" filter="url(#glow)">
    <circle r="3"><animateMotion dur="4s" repeatCount="indefinite" path="M90,91 H448" /></circle>
    <circle r="3" fill="#FF6B4A"><animateMotion dur="4s" repeatCount="indefinite" path="M1010,91 H652" /></circle>
  </g>
</svg>
